name: Cleanup Artifacts

on:
  workflow_dispatch:
    inputs:
      max_delete:
        description: 'Max number of artifacts to delete (0 = no limit)'
        type: number
        default: 0

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
    - name: Delete stored artifacts
      env:
        GH_TOKEN: ${{ github.token }}
        MAX_DELETE: ${{ inputs.max_delete }}
      run: |
        ids=$(gh api --paginate "/repos/${{ github.repository }}/actions/artifacts" --jq '.artifacts[].id')
        total=$(echo -n "$ids" | grep -c . || true)
        if [ "$MAX_DELETE" -gt 0 ] 2>/dev/null; then
          ids=$(echo "$ids" | head -n "$MAX_DELETE")
        fi
        echo "Found $total artifact(s) to delete"

        delete_artifact() {
          id="$1"
          if gh api -X DELETE "/repos/${{ github.repository }}/actions/artifacts/$id" >/dev/null 2>&1; then
            echo "ok"
          else
            echo "::warning::Failed to delete artifact $id" >&2
            echo "fail"
          fi
        }
        export -f delete_artifact
        export GH_TOKEN

        if [ -n "$ids" ]; then
          results=$(echo "$ids" | xargs -P 10 -I{} bash -c 'delete_artifact "$@"' _ {})
        else
          results=""
        fi
        count=$(echo "$results" | grep -c '^ok$' || true)
        failed=$(echo "$results" | grep -c '^fail$' || true)
        echo "Deleted $count artifact(s), $failed failure(s)"
