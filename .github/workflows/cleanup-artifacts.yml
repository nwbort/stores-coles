name: Cleanup Artifacts

on:
  workflow_dispatch:
    inputs:
      max_delete:
        description: 'Max number of artifacts to delete (0 = no limit)'
        type: number
        default: 0

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
    - name: Delete stored artifacts
      env:
        GH_TOKEN: ${{ github.token }}
        MAX_DELETE: ${{ inputs.max_delete }}
      run: |
        delete_artifact() {
          id="$1"
          if gh api -X DELETE "/repos/${{ github.repository }}/actions/artifacts/$id" >/dev/null 2>&1; then
            echo "$id ok"
          else
            echo "::warning::Failed to delete artifact $id" >&2
            echo "$id fail"
          fi
        }
        export -f delete_artifact
        export GH_TOKEN

        count=0
        failed=0
        failed_ids=""
        while :; do
          if [ "$MAX_DELETE" -gt 0 ] 2>/dev/null; then
            remaining=$((MAX_DELETE - count))
            if [ "$remaining" -le 0 ]; then
              break
            fi
          fi

          # Deleted artifacts drop out of the list, so re-fetching the top
          # page always surfaces the next batch - no offset tracking needed.
          # Artifacts that failed to delete stay in the list, so filter
          # those out to avoid retrying them forever.
          ids=$(gh api "/repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts[].id')
          if [ -n "$failed_ids" ]; then
            ids=$(comm -23 <(echo "$ids" | sort) <(echo "$failed_ids" | sort))
          fi
          if [ "$MAX_DELETE" -gt 0 ] 2>/dev/null; then
            ids=$(echo "$ids" | head -n "$remaining")
          fi
          if [ -z "$ids" ]; then
            break
          fi

          results=$(echo "$ids" | xargs -P 50 -I{} bash -c 'delete_artifact "$@"' _ {})
          count=$((count + $(echo "$results" | grep -c ' ok$' || true)))
          new_failed=$(echo "$results" | awk '$2 == "fail" { print $1 }')
          if [ -n "$new_failed" ]; then
            failed=$((failed + $(echo "$new_failed" | grep -c .)))
            failed_ids="$failed_ids
$new_failed"
          fi
        done

        echo "Deleted $count artifact(s), $failed failure(s)"
